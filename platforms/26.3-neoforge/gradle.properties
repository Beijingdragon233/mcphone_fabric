# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 【这一支没有 parchment】。1.21.1 那边有 parchment_minecraft_version /
# parchment_mappings_version 两个键，它只补参数名、不改类型名与方法名，加不加都
# 不影响编不编得过（这条写在 versions/targets.json 的 _comment 里）。26.3 上还没有
# 对应的 parchment 构建，硬留着会让配置阶段去解析一个不存在的构件 —— 所以整块删掉，
# build.gradle 里的 parchment { } 也一起删。等它有了再补回来。

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.3
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.3]
# The Neo version must agree with the Minecraft version to get a valid artifact
# 2026-09-19 查 maven.neoforged.net/releases/net/neoforged/neoforge/：26.3 这条线有
# 26.3.0.0-beta、26.3.0.1、26.3.0.2、26.3.0.3-beta 四个构建，取最新的那个。
# 这只是【编译】用的版本，不等于运行时要求的版本，后者见 neo_version_range。
neo_version=26.3.0.3-beta
# 运行时接受的 NeoForge 版本范围，写进 neoforge.mods.toml 的 versionRange。
# 下限钉在编译版上：26.3 这条线还在 beta，它的 API 会动，说"更低版本也兼容"
# 是拿没有验过的话骗玩家。等 26.3 出稳定版再往下松，跟 1.21.1 那支一样。
neo_version_range=[26.3.0.3-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# mod_id / mod_name / mod_license / mod_group_id / mod_version 在【仓库根的
# gradle.properties】里，所有平台共用一份，这里不许重复定义 —— CI 的
# build.yml 里有一道闸专门查这个（「检查平台有没有自己定义仓库级的键」）。

# JavaMP3 解码库的版本。
# 纯 Java、无依赖、MIT 许可，GitHub 上唯一一个非 LGPL 的纯 Java MP3 解码器。
# 上游已于 2023 年归档 —— 对一个 1993 年就冻结的格式来说，这比 API 客户端
# 停止维护的风险小得多；真出问题，MIT 许可让我们可以自己接手。
javamp3_version=1.0.1
# Rhino：脚本 App 的后端引擎（§16）。1.9.1 是 §16.2 实测过的那一版。
# 两者都是【原版与加载器之外】的库，但它们不是联动模组：Rhino 与 JavaMP3 不碰
# Minecraft 的类，跟 MC 版本无关，Maven Central 上原样能取。骨架阶段留下它们，
# 为的是把 jarJar 那条路一起在 26.3 上验一遍 —— 嵌库要跑 NeoForm Runtime，
# 那是"原版 + 加载器"之外最容易在版本跳档时坏的一环。
rhino_version=1.9.1

## 联动模组的版本键，这一支整块没有

# 1.21.1-neoforge 那边这里有 12 个键：curios_version、waystones_version、mcef_version、
# ae2_version、ae2wtlib_version、refinedstorage_version、toms_version 与
# toms_mod_version、balm_version、patchouli_version、netmusic_version、guideme_version。
# 26.3 上这些模组【一个构建都没有】（2026-09-19 查 Modrinth：Curios / Patchouli /
# MCEF / Refined Storage 零构建；AE2 / FTB Quests / NetMusic / GuideME 的 slug 当时
# 猜错返回 404，未取证）。留着它们等于在配置阶段解析一批必然解析不到的构件，
# 那会让"MDG 到底喂不喂得动 26.3"这个真问题被埋在一堆 resolution error 里。

# 所以这一支先只留原版 + 加载器 + 上面那两个嵌库。compat 那一层的代码与这些键，
# 等各家真的出 26.3 构建时再一起回来 —— 那时候它们该带着自己的取证，
# 就像 1.21.1 这份文件里每条都写清了"为什么是这个版本"。
