plugins {
    id 'java-library'
    id 'maven-publish'
    // 2.0.147 是 2026-09-19 查 maven.neoforged.net/releases/net/neoforged/moddev-gradle/
    // 得到的最新版。仓库另外两支钉的是 2.0.143，这一支先跟着最新走 —— 26.3 的工件
    // 形态与 1.21 不同（client jar 已经不混淆，见下面「这一支到底要回答什么」），
    // 用旧版插件去喂一个新形态，红了分不清是插件老还是版本新。
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

// ============================================================
//  这一支到底要回答什么
// ============================================================
//
// 只有一个问题：ModDevGradle + NeoForge 26.3 这套【工具链】喂不喂得动 26.3。
// 具体拆开是三件：
//
//   一、依赖解析能不能过 —— MDG 能不能从 maven.neoforged.net 拿到 26.3.0.3-beta
//       的 userdev 工件，并据此拿到 26.3 的原版 jar。
//   二、映射这一环还在不在 —— 26.3 的 client jar 【已经不混淆】：那个 jar 里
//       11266 个 net/minecraft/** 条目、0 个 class_N，而 1.21.1 那边是混淆的短随机名；
//       piston-meta 里 26.3 的 downloads 也只剩 client 与 server，没有 client_mappings。
//       所以风险不是「拉不到映射」，而是「插件吃不吃一个已经命名好的输入 jar」。
//       下面 src/main/java 里那一个探针类就是为此存在的：它 import 的全是 26.x 的
//       【新名字】（Identifier、GuiGraphicsExtractor），编得过就说明官方名真的到了
//       javac 眼前，编不过就以最省事的形态说明卡在哪一步。
//   三、jarJar 那条嵌库的路在 26.3 上还走不走得通（它要跑 NeoForm Runtime，
//       是「原版 + 加载器」之外最容易在版本跳档时坏的一环）。
//
// 【骨架阶段结束】：上面三个问题 2026-09-19 全答掉了（结论在 targets.json 里
// 26.3-neoforge 的 note）。这一支从这儿起【挂】shared/ 与共享层，也【apply】
// gradle/mcphone-checks.gradle。
//
// 挂上来的预期是【红】，这是故意的：这一轮红日志要回答的不是「编得过吗」——那已经知道
// 编不过——而是【改名之外还剩什么】。答案在 docs/PORTING-26.3.md，摘要：
//
//   挂载 422 个源文件 -> 1523 条错误 / 214 个文件（208 个文件一个字没改就编过了）。
//   其中 26.x 改名 588 条，本平台文件没补导致的直接引用与级联 690 条，
//   【真断】245 条 / 69 个文件。
//   两个原先的假设翻了案：fill 的 5 参形态在 26.3 还在（139 处一处不用动），
//   Screen 的 width/height/font/minecraft 也还在 —— 那 186 条是级联不是断裂。
//   要不要给层加一条「到 X 为止」的谓词：实测的答案是【不加】，签名不同的代码
//   本来就不符合层的准入条件，那 41 条覆写该走 platform/client/PhoneScreenBase
//   这条已有路子（判据与清单都在那份文档里）。
//
// 下面 tasks.withType(JavaCompile) 里的 -Xmaxerrs 就是为了让 javac 别在 100 条处截断，
// 把那一份清单收全 —— 这次 1523 条一条没丢。
//
// 翻是成对翻的：这里 true，versions/targets.json 里 26.3-neoforge 的 layers 也同时
// 从 [] 改回 ["1.20.3+", "1.20.5+", "1.21+", "neoforge"]。声明与实际必须同时翻，
// 否则「这个目标挂哪几层」就又是一句没人验的声明。
def mountSharedSources = true

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// ============================================================
//  仓库级身份
// ============================================================
//
// mod_version / mod_id / mod_name / mod_license / mod_group_id 在【仓库根的
// gradle.properties】里，所有平台共用一份 —— 与 1.21.1 那支同理：一次发版出好几个
// jar，它们必须是同一个版本号。
//
// 【读不到就失败，不给默认值】。
def repoRoot = file('../..')
def repoPropsFile = new File(repoRoot, 'gradle.properties')
if (!repoPropsFile.exists()) {
    throw new GradleException(
            "找不到 ${repoPropsFile.canonicalPath}。仓库级身份（mod_version 等）在那儿，" +
            "各平台不许自己定义。是不是把这个工程从仓库里单独拷出来了？")
}
def repoProps = new Properties()
repoPropsFile.withInputStream { repoProps.load(it) }
['mod_id', 'mod_name', 'mod_license', 'mod_group_id', 'mod_version'].each { k ->
    if (!repoProps.containsKey(k)) {
        throw new GradleException("仓库根的 gradle.properties 缺 ${k}")
    }
    ext[k] = repoProps.getProperty(k)
}

version = mod_version
group = mod_group_id

// ============================================================
//  共用代码（骨架阶段不挂，理由见文件头）
// ============================================================
//
// 层怎么解析、挂哪几层，全在 gradle/mcphone-layers.gradle 那一份里；这一支照旧
// apply 它，因为它顺手把「targets.json 里有没有 project == 本目录这一条」也验了。
apply from: "${projectDir}/../../gradle/mcphone-layers.gradle"

// 按目标改名挂载。表在 versions/name-renames.json，机制在 gradle/mcphone-renames.gradle。
// 与另三支的【唯一】差别：这一支挂进来的共用代码是 build/generated/name-renames/ 下
// 一份按目标改过名的副本，而 git 里那一份原文一个字没动、仍旧全平台共用。
// 为什么只能这么办（类型名出现在正文里，层的「逐字相同」准入条件表达不了它）
// 与那五条不变量，都记在改名表自己的 _comment 里。
apply from: "${projectDir}/../../gradle/mcphone-renames.gradle"

if (mountSharedSources) {
    mcphoneMountSharedJava(sourceSets.main.java,
            (['shared/src/main/java': new File(repoRoot, 'shared/src/main/java')] +
             mcphoneLayers.collectEntries { layer ->
                 [("${layer.relDir}/src/main/java"): layer.javaDir]
             }))

    sourceSets.main.resources {
        srcDir('../../shared/src/main/resources')
        mcphoneLayers.each { layer -> srcDir layer.resourcesDir }
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

// 【没有额外的仓库】。1.21.1 那支在这儿挂了 Modrinth（api.modrinth.com）与
// modmaven 两个，只为取联动模组的构件；这一支一个联动都不挂（见 gradle.properties），
// 所以不挂 —— 多挂一个仓库，每解析一个依赖就多问一次。

base {
    archivesName = mod_id
}

// Minecraft 26.3 跑在 Java 25 上：piston-meta 里 26.3 的 java_version 就是 25。
// CI 那边要 actions/setup-java 装上 25，否则挑 JDK 那一句会直接报 JAVA_HOME_25_X64 为空。
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // 【没有 parchment 块】。它只补参数名，不改类型名与方法名，缺它不影响编不编得过；
    // 而 26.3 上还没有对应的 parchment 构建，留着会让配置阶段去解析一个不存在的构件。

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 【十个联动模组全部不写】。26.3 上它们一个构建都没有（取证见 gradle.properties）。
    // 等哪家真出了 26.3 构建，对应的 compileOnly 与 compat/ 下那批代码一起回来，
    // 那时候这一支还得把 repositories 里的 Modrinth 挂回去。

    // JavaMP3 与 Rhino 不是联动模组，是嵌进 jar 的库，跟 MC 版本无关，留着它们
    // 顺带把 jarJar 这条路一起验了。
    jarJar(implementation("org.mozilla:rhino:[${rhino_version},2.0)"))

    jarJar(implementation("fr.delthas:javamp3:[${javamp3_version},2.0)"))
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    // 【javac 的错误条数不封顶】。骨架绿了不代表共用代码接上来也绿，而那一轮要的
    // 恰恰是一份完整的错误直方图：默认 javac 报满 100 条就停，剩下的改名点全在视野外，
    // 于是「还有多少处」这个问题只能等修完这 100 条再答一次。
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 各平台共用的构建校验（SPI 服务文件、dist 隔离、断言测试、双胞胎棘轮、 seams 清单）。
// 骨架阶段不挂 —— 理由在文件头，那是一段【必须一起删掉】的注释。
if (mountSharedSources) {
    apply from: "${projectDir}/../../gradle/mcphone-checks.gradle"
}
