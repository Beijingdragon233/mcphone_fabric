# MCphone —— 这一支的 access transformer。只放宽一处。
#
# 放宽了什么
#
#   net.minecraft.client.gui.components.MultiLineEditBox 那个 12 参构造器，
#   private → protected。签名与原版源码逐字对得上：
#   (Font, int x, int y, int width, int height, Component placeholder, Component narration,
#    int textColor, boolean textShadow, int cursorColor, boolean showBackground,
#    boolean showDecorations)，在 26.3 的源里是 MultiLineEditBox.java:35。
#
# 为什么必须放宽它
#
#   对外 API（com.november.mcphone.api.client.ui.PhoneMultiLineEditBox，API 代号 2）
#   给附属模组的形态是一个【构造器】，那一句 new 不能改。Java 的子类构造器只能调
#   直接父类的构造器，静态工厂（26.3 的 MultiLineEditBox.builder()）递不进 super(...)，
#   所以除放宽可见性之外没有第三条路。放宽到 protected 就够——只有子类要用它，
#   这一份文件【没有】改任何字段、方法或其他类的可见性。
#
# 两个入口，一份文件
#
#   编译期：platforms/26.3-neoforge/build.gradle 的 neoForge { accessTransformers = ... }
#   运行期：neoforge.mods.toml 里【没有】 [[accessTransformers]] 块，加载器按惯例回落到
#     META-INF/accesstransformer.cfg（那份模板自己的注释写了这条回落）。
#   两边吃同一份文件是有意的：写两处迟早对不上。
#
# 理由、逐个默认值的取证、以及 AT 机制的许可与再分发条件
#
#   docs/PORTING-26.3.md 的 §三十七；
#   gradle/access-transformer-LICENSE.md（Parchment / AT 机制的许可）。
protected net.minecraft.client.gui.components.MultiLineEditBox <init>(Lnet/minecraft/client/gui/Font;IIIILnet/minecraft/network/chat/Component;Lnet/minecraft/network/chat/Component;IZIZZ)V
