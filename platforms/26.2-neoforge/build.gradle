plugins {
    id 'java-library'
    id 'maven-publish'
    // 2.0.147 是当前 26.x 平台使用的 ModDevGradle 版本；26.2 的
    // 原版与 NeoForge 工件形态已经由实际构建验证。
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

// ============================================================
//  Minecraft 26.2 / NeoForge 平台
// ============================================================
//
// 这一支从已完成的 26.3 NeoForge 实现向下移植，当前目标版本是
// NeoForge 26.2.0.93。平台挂载 shared/ 与共享层，并通过
// versions/name-renames.json 把共用代码的官方名适配到 26.2 工件。
//
// 26.2 相对 26.3 的关键差异已经落在专用接缝里：
//   - ModConfig.Type.SYNCED 不存在，服务端配置使用 SERVER；
//   - InputEvent.Key 使用 getScanCode()，不是 26.3 的 getKeycode()；
//   - RecipeUnlockedTrigger 的条件字段是单数 recipe；
//   - 26.2 的 CommandSourceStack 构造器仍带文本名参数。
//
// 2026-10-24 的完整 build 与真实专用服务器启动已经通过；逐项证据记录在
// versions/targets.json 的 26.2-neoforge note。
def mountSharedSources = true

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// ============================================================
//  仓库级身份
// ============================================================
//
// mod_version / mod_id / mod_name / mod_license / mod_group_id 在【仓库根的
// gradle.properties】里，所有平台共用一份 —— 与 1.21.1 那支同理：一次发版出好几个
// jar，它们必须是同一个版本号。
//
// 【读不到就失败，不给默认值】。
def repoRoot = file('../..')
def repoPropsFile = new File(repoRoot, 'gradle.properties')
if (!repoPropsFile.exists()) {
    throw new GradleException(
            "找不到 ${repoPropsFile.canonicalPath}。仓库级身份（mod_version 等）在那儿，" +
            "各平台不许自己定义。是不是把这个工程从仓库里单独拷出来了？")
}
def repoProps = new Properties()
repoPropsFile.withInputStream { repoProps.load(it) }
['mod_id', 'mod_name', 'mod_license', 'mod_group_id', 'mod_version', 'mod_authors', 'mod_repo_url'].each { k ->
    if (!repoProps.containsKey(k)) {
        throw new GradleException("仓库根的 gradle.properties 缺 ${k}")
    }
    ext[k] = repoProps.getProperty(k)
}

version = mod_version
group = mod_group_id

// ============================================================
//  共用代码（骨架阶段不挂，理由见文件头）
// ============================================================
//
// 层怎么解析、挂哪几层，全在 gradle/mcphone-layers.gradle 那一份里；这一支照旧
// apply 它，因为它顺手把「targets.json 里有没有 project == 本目录这一条」也验了。
apply from: "${projectDir}/../../gradle/mcphone-layers.gradle"

// 按目标改名挂载。表在 versions/name-renames.json，机制在 gradle/mcphone-renames.gradle。
// 与另三支的【唯一】差别：这一支挂进来的共用代码是 build/generated/name-renames/ 下
// 一份按目标改过名的副本，而 git 里那一份原文一个字没动、仍旧全平台共用。
// 为什么只能这么办（类型名出现在正文里，层的「逐字相同」准入条件表达不了它）
// 与那五条不变量，都记在改名表自己的 _comment 里。
apply from: "${projectDir}/../../gradle/mcphone-renames.gradle"

if (mountSharedSources) {
    def excludedOptionalSources = []

    // These integrations have no 26.2 API artifact. Their original sources must
    // not reach javac at all. Stable facades in layers/version/26.2+ keep the
    // internal call sites compiling and report the capability as unavailable.
    if (!project.hasProperty('mcef_version')) {
        excludedOptionalSources +=
                'shared/src/main/java/com/november/mcphone/feature/browser/client/McefBackend.java'
    }
    if (!project.hasProperty('refinedstorage_version')) {
        excludedOptionalSources += [
                'layers/version/1.20.5+/src/main/java/com/november/mcphone/feature/terminal/integration/refinedstorage/TerminalSlotReference.java',
                'layers/version/1.20.5+/src/main/java/com/november/mcphone/feature/terminal/integration/refinedstorage/TerminalSlotReferenceFactory.java'
        ]
    }

    mcphoneMountSharedJava(sourceSets.main.java,
            (['shared/src/main/java': new File(repoRoot, 'shared/src/main/java')] +
             mcphoneLayers.collectEntries { layer ->
                 [("${layer.relDir}/src/main/java"): layer.javaDir]
             }), excludedOptionalSources)

    sourceSets.main.resources {
        srcDir('../../shared/src/main/resources')
        mcphoneLayers.each { layer -> srcDir layer.resourcesDir }
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

// The platform resource directory is declared first, so it owns 26.2-only
// overrides such as the new string-based recipe ingredients.
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 1.21+ 层仍带着旧复数的 advancement/recipes/。26.2 读取整个 advancement
    // 注册表，旧文件不会因为新单数文件存在就失效：它仍会被解析，并在
    // recipe_unlocked 的旧字段 recipe 上直接让世界加载失败。这里按目录整族排除，
    // 只保留平台目录里迁移过的 advancement/recipe/。
    exclude 'data/mcphone/advancement/recipes/**'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "MCPhoneVendored"
                url = new File(repoRoot, 'vendor/maven').toURI()
            }
        }
        filter {
            includeGroup "fr.delthas"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "modmaven"
        url = "https://modmaven.dev"
        content {
            includeGroup "de.mari_023"
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.2 跑在 Java 25 上：piston-meta 里 26.2 的 java_version 就是 25。
// CI 那边要 actions/setup-java 装上 25，否则挑 JDK 那一句会直接报 JAVA_HOME_25_X64 为空。
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // 只放宽一处可见性：net.minecraft.client.gui.components.MultiLineEditBox 那个
    // 12 参 private 构造器，放宽到 protected。为什么要放宽、为什么只能这么放宽，
    // 取证在 ../../docs/PORTING-26.3.md 的 §三十七；AT 机制的许可与再分发条件
    // 在 gradle/access-transformer-LICENSE.md。这一份文件【同时】是运行期的输入：
    // src/main/templates 那份 neoforge.mods.toml 没写 [[accessTransformers]] 块，
    // 加载器按惯例回落到 META-INF/accesstransformer.cfg，两边吃同一份是有意的。
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // AT 条目必须命中真实成员：写歪了要以构建错误收场，不要静默地什么都不改。
    validateAccessTransformers = true

    // 【没有 parchment 块】。它只补参数名，不改类型名与方法名，缺它不影响编不编得过；
    // 而 26.2 上还没有对应的 parchment 构建，留着会让配置阶段去解析一个不存在的构件。

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Waystones + Balm：真实 26.2 联动，运行时仍是可选依赖。
    compileOnly "maven.modrinth:waystones:${waystones_version}"
    compileOnly "maven.modrinth:balm:${balm_version}"
    localRuntime "maven.modrinth:waystones:${waystones_version}"
    localRuntime "maven.modrinth:balm:${balm_version}"
    localRuntime "maven.modrinth:shogi:${shogi_version}"

    compileOnly "maven.modrinth:curios:${curios_version}"
    localRuntime "maven.modrinth:curios:${curios_version}"

    compileOnly "maven.modrinth:ae2:${ae2_version}"
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    compileOnly "de.mari_023:ae2wtlib_api:${ae2wtlib_version}"
    localRuntime "maven.modrinth:ae2:${ae2_version}"
    localRuntime "maven.modrinth:guideme:${guideme_version}"
    localRuntime "maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}"

    compileOnly "maven.modrinth:toms-storage:${toms_version}"
    localRuntime "maven.modrinth:toms-storage:${toms_version}"

    // JavaMP3 与私有 Rhino 不是联动模组，是嵌进 jar 的库，跟 MC 版本无关。
    // 私有 Rhino 的坐标、摘要和打包规则由仓库级脚本统一锁定。
    // JavaMP3 用精确版本而不是范围：范围会让 CI 每次重新查询 Maven Central
    // 的版本元数据，jarJar 在无缓存的 runner 上会因此长时间停在依赖解析。
    jarJar(implementation("fr.delthas:javamp3:${javamp3_version}"))
}

apply from: '../../gradle/mcphone-engine-dependency.gradle'

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_repo_url           : mod_repo_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    // 【javac 的错误条数不封顶】。骨架绿了不代表共用代码接上来也绿，而那一轮要的
    // 恰恰是一份完整的错误直方图：默认 javac 报满 100 条就停，剩下的改名点全在视野外，
    // 于是「还有多少处」这个问题只能等修完这 100 条再答一次。
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 各平台共用的构建校验（SPI 服务文件、dist 隔离、断言测试、双胞胎棘轮、 seams 清单）。
// 骨架阶段不挂 —— 理由在文件头，那是一段【必须一起删掉】的注释。
if (mountSharedSources) {
    apply from: "${projectDir}/../../gradle/mcphone-checks.gradle"
    apply from: "${projectDir}/../../gradle/mcphone-recipe-unlocked-check.gradle"
}

if (mountSharedSources) {
    def assertDocMounts = ['docs': new File(repoRoot, 'docs')]
    mcphoneLayers.each { layer ->
        if (layer.docsDir.isDirectory()) {
            assertDocMounts["${layer.relDir}/docs"] = layer.docsDir
        }
    }
    def platformDocs = new File(projectDir, 'docs')
    if (platformDocs.isDirectory()) {
    assertDocMounts['platforms/26.2-neoforge/docs'] = platformDocs
    }

    def mountAssertTestsRenamed = mcphoneRegisterRenamedMount(
            'mountAssertTestsRenamed',
            assertDocMounts,
            layout.buildDirectory.dir('generated/assert-tests-renamed'),
            false)

    tasks.named('compileAssertTests', JavaCompile).configure {
        dependsOn mountAssertTestsRenamed
        setSource(mountAssertTestsRenamed.map { it.generatedDir })
    }
}
