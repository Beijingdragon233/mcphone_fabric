# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 【这一支没有 parchment】。1.21.1 那边有 parchment_minecraft_version /
# parchment_mappings_version 两个键，它只补参数名、不改类型名与方法名，加不加都
# 不影响编不编得过（这条写在 versions/targets.json 的 _comment 里）。26.2 上还没有
# 对应的 parchment 构建，硬留着会让配置阶段去解析一个不存在的构件 —— 所以整块删掉，
# build.gradle 里的 parchment { } 也一起删。等它有了再补回来。

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
# 2026-10-24 查 maven.neoforged.net/releases/net/neoforged/neoforge/：26.2 线
# 当前最新为 26.2.0.93。
neo_version=26.2.0.93
# 运行时接受的 NeoForge 版本范围，写进 neoforge.mods.toml 的 versionRange。
# 下限钉在编译版上。26.2 已进入稳定线，仍以实际编译版作为运行时下限。
neo_version_range=[26.2.0.93,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# mod_id / mod_name / mod_license / mod_group_id / mod_version 在【仓库根的
# gradle.properties】里，所有平台共用一份，这里不许重复定义 —— CI 的
# build.yml 里有一道闸专门查这个（「检查平台有没有自己定义仓库级的键」）。

# JavaMP3 解码库的版本。
# 纯 Java、无依赖、MIT 许可，GitHub 上唯一一个非 LGPL 的纯 Java MP3 解码器。
# 上游已于 2023 年归档 —— 对一个 1993 年就冻结的格式来说，这比 API 客户端
# 停止维护的风险小得多；真出问题，MIT 许可让我们可以自己接手。
javamp3_version=1.0.1
# Rhino：脚本 App 的后端引擎（§16）。1.9.1 是 §16.2 实测过的那一版。
# 两者都是【原版与加载器之外】的库，但它们不是联动模组：Rhino 与 JavaMP3 不碰
# Minecraft 的类，跟 MC 版本无关，Maven Central 上原样能取。骨架阶段留下它们，
# 为的是把 jarJar 那条路一起在 26.2 上验一遍 —— 嵌库要跑 NeoForm Runtime，
# 那是"原版 + 加载器"之外最容易在版本跳档时坏的一环。
rhino_version=1.9.1

## 联动模组版本键

# Waystones（传送石碑，可选依赖）。
waystones_version=26.2.0.12+neoforge-26.2

# Balm 是 Waystones 的独立前置模组，必须单独声明。
balm_version=26.2.0.9+neoforge-26.2

# Curios（饰品栏，可选依赖）。
curios_version=16.0.0+26.2

# AE2 与它的硬前置 GuideME。
ae2_version=26.2.1-alpha
guideme_version=26.2.2-alpha

# AE2WTLib 的 26.2 构建。它的 API 模块以 jarJar 形式随模组发布。
ae2wtlib_version=26.2.0-beta

# Tom's Simple Storage 的 26.2 构建。
toms_version=26.2-2.11.3

# Shogi 是 Waystones 26.2 的硬前置。Modrinth Maven 不会替我们把
# 这类模组依赖自动带进开发运行时，所以 localRuntime 必须单独列出。
shogi_version=26.2.0.8+neoforge-26.2
